<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angela Brown | Career Roadmap</title>
  <meta name="description" content="Angela Brown: executive operations and strategic support. Click through five roles to see skills, lessons, and stories.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,700&display=swap">
  <!-- When you upload new files, raise the number after v= (for example v=13 to v=14) on the three lines that use it, so browsers load the new versions. -->
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <main class="page">

    <header class="top">
      <div class="top-left">
        <p class="badge"><span class="dot"></span>Career Roadmap</p>
        <h1 id="name"></h1>
        <p class="headline" id="headline"></p>
      </div>
      <div class="contact" id="contact"></div>
      <ul class="chips" id="chips"></ul>
    </header>

    <section aria-labelledby="road-title">
      <h2 class="section-title" id="road-title">Click Any Step to Explore</h2>
      <ol class="roadmap" id="roadmap"></ol>
      <div class="detail" id="detail" aria-live="polite"></div>
    </section>

    <section aria-labelledby="strength-title" class="strengths">
      <h2 class="section-title" id="strength-title">Explore by Strength</h2>
      <div class="strength-row" id="strengths"></div>
      <p class="strength-text" id="strength-text">Pick a strength to see where it shows up on the roadmap.</p>
    </section>

    <p class="banner" id="through"></p>

  </main>

  <script src="content.js?v=14"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
